name: Varredura diária do DOM

on:
  schedule:
    - cron: "30 10 * * *"   # 07:30 em Brasília: fecha a edição publicada na véspera
    - cron: "30 0 * * *"    # 21:30 em Brasília: pega a edição do dia, publicada ao fim da tarde
  workflow_dispatch:
    inputs:
      desde:
        description: "Data inicial (AAAA-MM-DD). Vazio = últimos 15 dias. Use 2026-07-03 para refazer o histórico."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: varredura-dom
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pip install -q openpyxl
      - name: Definir data inicial
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then D="${{ github.event.inputs.desde }}"; else D=$(date -u -d '15 days ago' +%F); fi
          echo "DESDE=$D" >> "$GITHUB_ENV"
      - name: Coletar edições novas
        run: python scripts/coletar.py "$DESDE"
      - name: Extrair texto dos PDFs novos
        run: python scripts/extrair.py auto textos
      - name: Separar atos, avaliar alertas e montar o painel
        run: |
          python scripts/atos.py
          python scripts/alertas.py
          python scripts/inteligencia.py
          python scripts/painel.py
      - name: Verificar integridade
        id: integridade
        continue-on-error: true
        run: python scripts/verificar.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados textos relatorios docs
          git commit -m "Varredura do DOM $(date -u +%F\ %H:%M) UTC" || echo "sem mudanças"
          git pull --rebase -q origin main || true
          git push
      - name: Falhar se a integridade não passou
        if: steps.integridade.outcome == 'failure'
        run: |
          echo "Alguma edição ficou sem texto ou sem atos. Veja o passo 'Verificar integridade'."
          exit 1
