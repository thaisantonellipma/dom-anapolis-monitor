name: Teste 2 - conferência com o histórico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pip install -q openpyxl
      - name: Coletar edições 3.982 a 4.003
        run: python scripts/coletar.py 2026-06 2026-08 3982 4003
      - name: Extrair texto por coluna
        run: python scripts/extrair.py
      - name: Conferir com a planilha
        run: python scripts/conferir.py
      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados textos relatorios
          git commit -m "Resultados do teste 2" || echo "sem mudanças"
          git push
